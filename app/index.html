<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MiroBridgeMCP</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
// Headless Miro app: Miro loads this page in a hidden iframe whenever a board with the app is open.
const CREATE = {
  sticky_note: 'createStickyNote', shape: 'createShape', text: 'createText', card: 'createCard',
  app_card: 'createAppCard', frame: 'createFrame', connector: 'createConnector', image: 'createImage', embed: 'createEmbed',
};
const plain = (x) => JSON.parse(JSON.stringify(x)); // SDK items are class instances
const byIds = (ids) => Promise.all(ids.map((id) => miro.board.getById(id)));

async function addToFrame(item, parentId) {
  const frame = await miro.board.getById(parentId);
  if (frame.type !== 'frame') throw new Error(`parentId ${parentId} is a ${frame.type}, not a frame`);
  // Miro sometimes hasn't placed a just-created item yet ("isn't inside a parent frame"): retry briefly
  for (let attempt = 1; ; attempt++) {
    try { return await frame.add(item); } catch (err) {
      if (attempt >= 4 || !/inside a parent frame/.test(err?.message)) {
        throw new Error(`${err?.message || err}. Keep the board window visible (not minimized) while adding items to frames.`);
      }
      await new Promise((r) => setTimeout(r, 400 * attempt));
    }
  }
}

const ops = {
  get_board_info: () => miro.board.getInfo(),
  get_items: ({ type, ids }) => miro.board.get({ ...(type && { type }), ...(ids && { id: ids }) }),
  get_selection: () => miro.board.getSelection(),
  async create_items({ items }) {
    const out = [];
    try {
      for (const { type, props } of items) {
        const { parentId, ...rest } = props;
        const item = await miro.board[CREATE[type]](rest);
        out.push(item);
        if (parentId) await addToFrame(item, parentId);
      }
    } catch (err) { // all-or-nothing: don't leave half a batch on someone's board
      for (const item of out) await miro.board.remove(item).catch(() => {});
      throw new Error(`${err?.message || err} (rolled back ${out.length} item(s) from this call)`);
    }
    return out;
  },
  async update_items({ items }) {
    const out = [];
    for (const { id, props } of items) {
      let item = await miro.board.getById(id);
      const { style, parentId, ...rest } = props;
      Object.assign(item, rest);
      if (style) item.style = { ...item.style, ...style };
      await item.sync();
      if (parentId) { await addToFrame(item, parentId); item = await miro.board.getById(id); } // move into a frame
      if (parentId === null && item.parentId) { await (await miro.board.getById(item.parentId)).remove(item); item = await miro.board.getById(id); }
      out.push(item);
    }
    return out;
  },
  async delete_items({ ids }) {
    let deleted = 0;
    for (const id of ids) {
      const [item] = await miro.board.get({ id }); // [] if already gone: removing a shape also removes its connectors
      if (item) { await miro.board.remove(item); deleted++; }
    }
    return { deleted, alreadyGone: ids.length - deleted };
  },
  // focus = ids the user marked as "what we're talking about"; stored on the board so it survives reloads
  get_app_status: () => ({ version: APP_VERSION, actions: registered, actionErrors, actionsApi: Boolean(miro.board.experimental?.action?.register) }), // for `check`
  get_focus_ids: async () => (await miro.board.getAppData('focus')) || [],
  async set_focus({ ids }) {
    await miro.board.setAppData('focus', ids);
    return { focus: ids.length };
  },
  async zoom_to({ ids }) {
    await miro.board.viewport.zoomTo(await byIds(ids));
    return { ok: true };
  },
};

const APP_VERSION = '__VERSION__'; // filled in by the bridge when it serves this page
let connected = false;
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { connected = true; ws.send(JSON.stringify({ hello: APP_VERSION })); };
  ws.onclose = () => { connected = false; setTimeout(connect, 2000); }; // server restarts with each AI app session
  ws.onmessage = async (e) => {
    const { id, op, params } = JSON.parse(e.data);
    try {
      if (!ops[op]) throw new Error(`Unknown op ${op}`);
      ws.send(JSON.stringify({ id, result: plain(await ops[op](params)) }));
    } catch (err) {
      ws.send(JSON.stringify({ id, error: err?.message || String(err) }));
    }
  };
}
if (window.top !== window.self) connect(); // only inside Miro's iframe; a plain localhost tab has no board

// icon click: selection -> set focus; nothing selected -> clear focus. Also reports connection status.
miro.board.ui.on('icon:click', async () => {
  const note = connected ? '' : ' (no AI app connected yet)';
  const sel = await miro.board.getSelection();
  if (sel.length) {
    await miro.board.setAppData('focus', sel.map((i) => i.id));
    return miro.board.notifications.showInfo(`AI focus: ${sel.length} item(s)${note}`);
  }
  const had = ((await miro.board.getAppData('focus')) || []).length;
  await miro.board.setAppData('focus', []);
  miro.board.notifications.showInfo(had ? `AI focus cleared${note}` : `Select items, then click this icon to focus the AI on them${note}`);
});

// Item-toolbar menu on selected items ("custom actions", experimental). Miro rules: share-link apps only, max 4 actions,
// subscribe before register, register again on every load (actions live only while this headless app runs).
// Icon names come from Miro's internal set with no published list, so each action tries a few and falls back.
const ACTIONS = [
  { event: 'ai-focus', label: 'Focus AI here', description: 'The AI starts from these items (replaces the focus)',
    icons: ['target', 'magic', 'star'], next: (ids) => ids },
  { event: 'ai-focus-add', label: 'Add to AI focus', description: 'Keep the current AI focus and add these items',
    icons: ['plus-circle', 'plus', 'add'], next: (ids, cur) => [...new Set([...cur, ...ids])] },
  { event: 'ai-focus-remove', label: 'Remove from AI focus', description: 'Take these items out of the AI focus',
    icons: ['minus-circle', 'minus', 'cross'], next: (ids, cur) => cur.filter((id) => !ids.includes(id)) },
];
const registered = {}; // event -> icon that worked; reported to the bridge for `check`
const actionErrors = {}; // event -> last error, so `check` can say why instead of guessing
async function registerActions() {
  const api = miro.board.experimental?.action;
  if (!api?.register) return console.warn('MiroBridgeMCP: custom actions not available on this board');
  for (const a of ACTIONS) {
    await miro.board.ui.on(`custom:${a.event}`, async ({ items }) => {
      const cur = (await miro.board.getAppData('focus')) || [];
      const focus = a.next(items.map((i) => i.id), cur);
      await miro.board.setAppData('focus', focus);
      miro.board.notifications.showInfo(focus.length ? `AI focus: ${focus.length} item(s)` : 'AI focus cleared');
    });
    for (const icon of [...a.icons, 'chat-two']) { // chat-two is used in Miro's own example, so it is known to exist
      try {
        await api.register({ event: a.event, scope: 'local', selection: 'multi', contexts: { item: {} },
          ui: { label: a.label, description: a.description, icon, position: ACTIONS.indexOf(a) + 1 } });
        registered[a.event] = icon;
        break;
      } catch (err) { actionErrors[a.event] = `${icon}: ${err?.message || err}`; }
    }
  }
}
registerActions();
</script>
</body>
</html>
